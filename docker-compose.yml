# Un solo comando levanta todo:   docker compose up -d --build
# Arquitectura: Microservicios con Broker de Eventos (EDA) + OIDC (Keycloak)
# Arquitectura de Software 1 - UNAHUR

services:

  # 1. Base de datos del microservicio de envíos
  envios-db:
    image: postgres:16-alpine
    container_name: envios-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./envios/envios-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  # 2. Base de Keycloak
  # Red propia (kc-net): ni la API ni los servicios pueden llegar a esta base directamente.
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: ${KC_DB_NAME}
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - kcdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER} -d ${KC_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kc-net

  # 3. Servidor de Identidad Keycloak (OIDC / JWT)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak-auth
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - kc-net
      - backend

  # 4. Message Broker (RabbitMQ) - Pilar del NFR-2 (Extensibilidad) y NFR-1 (Tiempo Real)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-broker
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # RabbitMQ Management Web UI
    volumes:
      - ./broker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./broker/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # 5. API Gateway
  gateway:
    build: ./apigateway
    container_name: api-gateway
    environment:
      PORT: 3000
      ENVIOS_URL: http://envios:3000
      TRACKING_URL: http://tracking:3000
      KEYCLOAK_ISSUER: http://localhost:8081/realms/${KC_REALM}
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/${KC_REALM}/protocol/openid-connect/certs
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KC_REALM: ${KC_REALM}      
    ports:
      - "3000:3000"
    depends_on:
      keycloak:
        condition: service_healthy
      envios:
        condition: service_started
      tracking:
        condition: service_healthy
    networks:
      - backend

  # 6. Microservicio de Envíos (Core Transaccional + Productor de Eventos)
  envios:
    build: ./envios
    container_name: microservicio-envios
    environment:
      PORT: 3000
      DB_HOST: envios-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ISSUER: http://localhost:8081/realms/${KC_REALM}
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/${KC_REALM}/protocol/openid-connect/certs
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KC_REALM: ${KC_REALM}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      envios-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  # Redis del microservicio de Tracking (estado vivo, sin persistencia)
  tracking-redis:
    image: redis:7-alpine
    container_name: tracking-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  # Microservicio de Tracking en tiempo real (NestJS + SSE)
  tracking:
    build: ./tracking
    container_name: microservicio-tracking
    environment:
      PORT: 3000
      REDIS_URL: redis://tracking-redis:6379
      POS_TTL_S: ${TRACKING_POS_TTL_S:-30}
      RABBITMQ_URL: ${RABBITMQ_URL:?Defini RABBITMQ_URL en .env}
      RABBITMQ_EXCHANGE: ${EXCHANGE_NAME:?Defini EXCHANGE_NAME en .env}
      RABBITMQ_QUEUE: ${TRACKING_RABBITMQ_QUEUE:?Defini TRACKING_RABBITMQ_QUEUE en .env}
    ports:
      - "${TRACKING_PORT:-3002}:3000"
    volumes:
      - ./tracking/public:/app/public:ro   # editar las páginas HTML sin reconstruir la imagen
    depends_on:
      tracking-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/tracking/metrics').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend

  # 11. Frontend React del Cadete
  cadete-front:
    build:
      context: ./cadete-front
      args:
        VITE_API_URL: ${APIGATEWAY_URL:-http://localhost:3000}
        VITE_KEYCLOAK_CLIENT_ID: ${CADETE_FRONT_KEYCLOAK_CLIENT_ID:-motomensajeria-web}
    container_name: cadete-front
    ports:
      - "${CADETE_FRONT_PORT:-5174}:80"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      gateway:
        condition: service_started
    networks:
      - backend

  # Simulador de cadetes (demo de tiempo real, ~N reportes cada 5 s)
  simulator:
    image: node:20-alpine
    container_name: tracking-simulator
    working_dir: /sim
    volumes:
      - ./simulator:/sim:ro
    command: [ "node", "sim.js" ]
    environment:
      API: http://tracking:3000
      N: ${SIM_CADETES:-25}
      INTERVAL_MS: ${SIM_INTERVAL_MS:-5000}
      SPEED_MS: ${SIM_SPEED_MS:-40}
    depends_on:
      tracking:
        condition: service_healthy
    networks:
      - backend

  # 9. Documentación Interactiva Swagger UI
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: swagger-ui
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro
    ports:
      - "8080:8080"

  # 8. Web del Cliente (React SPA - Stack PERN - Responsable: Ezequiel)
  cliente-web:
    build: ./cliente-web
    container_name: cliente-web
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - gateway

  # Frontend React del Operador (operador-front)
  # al API Gateway (:3000) y al panel de Tracking (:3002).
  operador-front:
    build:
      context: ./operador-front
      args:
        VITE_API_URL: ${APIGATEWAY_URL:-http://localhost:3000}
        VITE_TRACKING_URL: ${OPERADOR_FRONT_TRACKING_URL:-http://localhost:3002}
        VITE_KEYCLOAK_CLIENT_ID: ${OPERADOR_FRONT_KEYCLOAK_CLIENT_ID:-motomensajeria-web}
    container_name: operador-front
    ports:
      - "${OPERADOR_FRONT_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      gateway:
        condition: service_started
      tracking:
        condition: service_healthy
    networks:
      - backend

volumes:
  pgdata:
  kcdata:

networks:
  backend:
  kc-net:
