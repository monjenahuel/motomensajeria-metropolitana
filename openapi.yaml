openapi: 3.0.3
info:
  title: API de Motomensajería Metropolitana
  version: 1.0.0
  description: |
    API REST y SSE para la gestión de envíos, asignación por operadores, actualización de estados y telemetría por cadetes.
    Protegida mediante OIDC (Keycloak) con validación de roles en API Gateway y microservicios (Zero Trust).
    Los eventos de dominio se publican asíncronamente vía RabbitMQ (`motomensajeria.events`).

    ### Estrategia de versionado
    - **Prefijo en URI por versión mayor:** las rutas oficiales de la versión 1 se exponen bajo `/v1` (`http://localhost:3000/v1/...`).
    - **Cabecera informativa:** todas las respuestas del API Gateway incluyen el header `API-Version: 1.0`.
    - **Compatibilidad y evolución:** los cambios aditivos retrocompatibles (nuevos campos opcionales o endpoints) se incorporan dentro de `v1`. Ante cambios incompatibles (*breaking changes*), se introducirá `/v2` manteniendo `/v1` durante la ventana de transición.
    - **Alias de compatibilidad y deprecación:** durante la transición se conservan las rutas sin prefijo como alias equivalentes en el Gateway, y las rutas superadas se marcan con `deprecated: true` (como `PATCH /envios/{id}/estado`, reemplazada por `PATCH /cadete/envios/{id}/estado`).
servers:
  - url: http://localhost:3000/v1
    description: API Gateway v1 (punto de entrada oficial versionado)
  - url: http://localhost:3000
    description: API Gateway (alias de compatibilidad sin prefijo)
tags:
  - name: Autenticación
    description: Obtención de tokens OIDC y perfil
  - name: Envíos
    description: Ciclo de vida y tracking de envíos
  - name: Operador
    description: Asignación y liberación de envíos (módulo Operador del MS de Envíos)
  - name: Cadete
    description: Envíos asignados al cadete autenticado y actualización de su estado (módulo Cadete del MS de Envíos)
  - name: Tracking
    description: Posiciones GPS en tiempo real (Redis + SSE) y proyección de asignaciones
  - name: Notificaciones
    description: Consulta histórica y stream SSE en vivo de avisos por rol
  - name: Mapas
    description: Gestión de cookie HttpOnly para embebido seguro de mapas SSE
  - name: Sistema
    description: Verificación de salud y diagnóstico

security:
  - BearerAuth: []
  - OAuth2: []

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Health check público del servicio
      security: []
      responses:
        '200':
          description: Servicio y base de datos operativos

  /auth/token:
    post:
      tags: [Autenticación]
      summary: Obtener token de acceso OIDC
      description: Permite a las aplicaciones frontend autenticarse contra el Gateway mediante Resource Owner Password o Refresh Token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: cliente.demo
                password:
                  type: string
                  example: cliente123
                grant_type:
                  type: string
                  default: password
                  enum: [password, refresh_token]
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token obtenido exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  expires_in:
                    type: integer
                  token_type:
                    type: string
                    example: Bearer
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'

  /auth/me:
    get:
      tags: [Autenticación]
      summary: Consultar identidad del usuario actual
      description: Retorna los datos y roles del usuario según el token Bearer provisto.
      responses:
        '200':
          description: Datos del usuario autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub:
                    type: string
                  username:
                    type: string
                  email:
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/ProblemDetails401'

  /envios:
    get:
      tags: [Envíos]
      summary: Listar envíos
      description: |
        Filtra automáticamente por rol:
        - `cliente`: solo ve los envíos que creó.
        - `cadete`: solo ve los envíos que tiene asignados.
        - `operador` o `administrador`: ve todos los envíos.
      responses:
        '200':
          description: Lista de envíos permitidos para el usuario autenticado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Envio'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'

    post:
      tags: [Envíos]
      summary: Crear un nuevo envío
      description: Permite a clientes o staff registrar un nuevo envío. Publica el evento `envio.creado` al broker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origen, destino]
              properties:
                origen:
                  type: string
                  example: Av. Corrientes 1000, CABA
                destino:
                  type: string
                  example: Av. Cabildo 2000, CABA
                lat_origen:
                  type: number
                  example: -34.6037
                lon_origen:
                  type: number
                  example: -58.3816
                lat_destino:
                  type: number
                  example: -34.5614
                lon_destino:
                  type: number
                  example: -58.4563
      responses:
        '201':
          description: Envío creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envio'
        '400':
          $ref: '#/components/responses/ProblemDetails400'

  /envios/{id}:
    get:
      tags: [Envíos]
      summary: Consultar detalle de un envío con historial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 01a1a901-5800-7000-8000-000000000001
      responses:
        '200':
          description: Detalle del envío e historial de transiciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvioConHistorial'
        '404':
          $ref: '#/components/responses/ProblemDetails404'

  /envios/{id}/asignar:
    patch:
      tags: [Operador]
      summary: Asignar un envío a un cadete (Caso de uso del Operador)
      description: |
        Exclusivo de usuarios con rol `operador` o `administrador`.
        Transiciona el envío de `PENDIENTE` a `ASIGNADO` y emite el evento `envio.asignado` en RabbitMQ.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 01a1a901-5800-7000-8000-000000000001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mensajero]
              properties:
                mensajero:
                  type: string
                  description: Username de Keycloak del cadete asignado
                  example: cadete.demo
      responses:
        '200':
          description: Envío asignado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envio'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          description: El envío no se encuentra en estado PENDIENTE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /envios/{id}/estado:
    patch:
      tags: [Cadete]
      deprecated: true
      summary: Actualizar estado de envío (alias de compatibilidad)
      description: |
        Se mantiene por compatibilidad. La ruta vigente es
        `PATCH /cadete/envios/{id}/estado`, documentada en el módulo Cadete.
        Exclusivo del `cadete` asignado al envío; emite `envio.estado_actualizado`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 01a1a901-5800-7000-8000-000000000001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoCadeteRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envio'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          description: El envío ya está en un estado final
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /cadete/envios:
    get:
      tags: [Cadete]
      summary: Listar mis envíos asignados
      description: |
        Devuelve los envíos cuyo `mensajero` es el username del cadete
        autenticado. Incluye los finalizados para conservar el historial.
        Exclusivo del rol `cadete`.
      responses:
        '200':
          description: Envíos asignados al cadete
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnvioCadete'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'

  /cadete/envios/{id}:
    get:
      tags: [Cadete]
      summary: Ver datos básicos de un envío asignado
      description: |
        Devuelve los datos básicos del envío. Responde 404 si no existe o si
        está asignado a otro cadete, para no revelar su existencia.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 01a1a901-5800-7000-8000-000000000001
      responses:
        '200':
          description: Datos básicos del envío
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvioCadete'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '404':
          $ref: '#/components/responses/ProblemDetails404'

  /cadete/envios/{id}/estado:
    patch:
      tags: [Cadete]
      summary: Actualizar el estado de un envío asignado
      description: |
        Solo el cadete asignado puede cambiar el estado. Estados permitidos:
        `EN_CAMINO`, `ENTREGADO`, `NO_ENTREGADO`. Los envíos en estado final
        (`ENTREGADO`, `NO_ENTREGADO`, `CANCELADO`) no admiten más cambios (409).
        Persiste el cambio y su historial en PostgreSQL y publica
        `envio.estado_actualizado`; Tracking libera la asignación al finalizar.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 01a1a901-5800-7000-8000-000000000001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoCadeteRequest'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envio'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          description: El envío ya está en un estado final
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /operador/asignaciones:
    get:
      tags: [Operador]
      summary: Listar envíos con cadete asignado
      description: |
        Devuelve los envíos que tienen un cadete asignado, incluidos los que ya
        finalizaron (el `mensajero` se conserva como historial). La fuente de
        verdad es PostgreSQL en el MS de Envíos. Exclusivo de `operador` o
        `administrador`.
      responses:
        '200':
          description: Envíos con cadete asignado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Envio'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
    post:
      tags: [Operador]
      summary: Asignar un envío a un cadete
      description: |
        Equivalente a `PATCH /envios/{id}/asignar`, con el `envioId` en el cuerpo.
        Persiste la asignación en PostgreSQL y publica `envio.asignado` en RabbitMQ;
        Tracking la recibe por el broker y actualiza su proyección en PostgreSQL propio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignacionRequest'
      responses:
        '200':
          description: Envío asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envio'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          description: El envío no se encuentra en estado PENDIENTE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /operador/asignaciones/{envioId}:
    delete:
      tags: [Operador]
      summary: Liberar la asignación de un envío
      description: |
        Solo para envíos en estado `ASIGNADO`. Vuelve el envío a `PENDIENTE`,
        quita el cadete asignado y publica `envio.estado_actualizado` con
        `estadoNuevo: PENDIENTE`.
      parameters:
        - name: envioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 01a1a901-5800-7000-8000-000000000001
      responses:
        '200':
          description: Asignación liberada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envio'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          description: El envío no se encuentra en estado ASIGNADO
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /tracking/ubicaciones:
    post:
      tags: [Tracking]
      summary: Reportar la posición GPS de un cadete
      description: |
        Requiere token Bearer con rol `cadete`. El API Gateway sobreescribe
        `cadeteId` a partir de `preferred_username` del token (y `CadeteAuthGuard`
        lo revalida en `tracking`), ignorando cualquier `cadeteId` enviado en el cuerpo.
        Persiste en `tracking-redis` con TTL y publica por Redis Pub/Sub para SSE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReporteUbicacion'
      responses:
        '202':
          description: Posición aceptada y publicada
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'

  /tracking/cadetes:
    get:
      tags: [Tracking]
      summary: Última posición de todos los cadetes con señal
      description: Exclusivo para roles `operador` o `administrador` vía API Gateway.
      responses:
        '200':
          description: Posiciones vigentes (las expiradas no se incluyen)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Posicion'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'

  /tracking/cadetes/{id}/posicion:
    get:
      tags: [Tracking]
      summary: Última posición de un cadete
      description: |
        Requiere rol `operador` / `administrador`, o rol `cadete` consultando su propia posición (`id == preferred_username`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: cadete.demo
      responses:
        '200':
          description: Última posición conocida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Posicion'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'

  /tracking/envios/{envioId}/posicion:
    get:
      tags: [Tracking]
      summary: Última posición del cadete asignado a un envío
      description: |
        Accesible vía Gateway para el dueño del envío, el cadete asignado o staff (`operador`/`administrador`).
        Solo disponible cuando el envío está en estado `EN_CAMINO` (devuelve `409 Conflict` en otros estados).
      parameters:
        - name: envioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 01a1a901-5800-7000-8000-000000000002
      responses:
        '200':
          description: Última posición conocida del cadete asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Posicion'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'

  /tracking/envios/{envioId}/stream:
    get:
      tags: [Tracking]
      summary: Seguimiento en vivo de un envío (SSE, vista del cliente)
      description: |
        Entrega primero la última posición conocida del cadete asignado y luego
        las actualizaciones en vivo. Requiere BearerAuth (o cookie HttpOnly `mapa_token`
        vía `/mapas/tracking/envios/{envioId}/stream`), ownership sobre el envío y estado
        `EN_CAMINO`. El Gateway reconecta cada 30 s para revalidar permisos.

        **No usar "Try it out" de Swagger UI:** el canal SSE queda abierto y
        Swagger espera una respuesta completa. Probarlo con `curl -N` o desde
        las vistas del mapa en vivo.
      parameters:
        - name: envioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 01a1a901-5800-7000-8000-000000000002
      responses:
        '200':
          description: Flujo SSE con eventos `data` y `ping` cada 15 s
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                data: {"cadeteId":"cadete.demo","lat":-34.6037,"lng":-58.3816,"ts":1760000000000,"recibidoEn":1760000000100,"rumbo":90}
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'

  /tracking/stream:
    get:
      tags: [Tracking]
      summary: Todas las posiciones en vivo (SSE, vista del operador)
      description: |
        Canal SSE con todas las posiciones de los cadetes y un `ping` cada 15 s.
        Exclusivo para roles `operador` o `administrador`.

        **No usar "Try it out" de Swagger UI:** el canal SSE queda abierto y
        Swagger espera una respuesta completa. Probarlo con `curl -N` o desde
        `operador-front`.
      responses:
        '200':
          description: Flujo SSE con todas las posiciones y `ping` cada 15 s
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                data: {"cadeteId":"cadete.demo","lat":-34.6037,"lng":-58.3816,"ts":1760000000000,"recibidoEn":1760000000100,"rumbo":90}
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'

  /tracking/asignaciones:
    get:
      tags: [Tracking]
      summary: Proyección de asignaciones envío ↔ cadete
      description: |
        Vista de solo lectura de las asignaciones que Tracking recibió por RabbitMQ
        y reconcilió contra Envíos. Exclusivo de `operador` o `administrador`.
      responses:
        '200':
          description: Asignaciones vigentes según los eventos consumidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asignacion'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'

  /tracking/metrics:
    get:
      tags: [Tracking]
      summary: Métricas del servicio de Tracking
      description: Métricas de observabilidad y percentiles internos. Exclusivo de `operador` o `administrador` vía Gateway.
      responses:
        '200':
          description: Reportes por segundo, conexiones SSE y latencias internas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricasTracking'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'

  /notificaciones:
    get:
      tags: [Notificaciones]
      summary: Listar avisos de envíos
      description: |
        El rol `cliente` consulta únicamente sus propios avisos; `operador` y
        `administrador` pueden ver todos los avisos registrados.
      parameters:
        - name: envioId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: desde
          in: query
          required: false
          description: Filtra avisos con id numérico estrictamente mayor al indicado (`>= 0`)
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Lista de avisos ordenados cronológicamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notificacion'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'

  /notificaciones/stream:
    get:
      tags: [Notificaciones]
      summary: Stream SSE de eventos y avisos en tiempo real
      description: |
        Emite eventos `notificacion` en vivo filtrados según el rol autenticado
        (`cliente`, `cadete`, `operador`, `administrador`), con latido `: ping` cada 15 s.
      responses:
        '200':
          description: Flujo SSE `text/event-stream`
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'

  /mapas/sesion:
    post:
      tags: [Mapas]
      summary: Iniciar sesión de mapas vía cookie HttpOnly
      description: |
        Valida el Bearer JWT del usuario y emite la cookie `mapa_token` (`HttpOnly; SameSite=Lax; Path=/mapas; Max-Age=300`)
        para autenticar vistas iframe y `EventSource` bajo `/mapas/*` sin exponer tokens en la URL.
      responses:
        '204':
          description: Cookie `mapa_token` emitida
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
    delete:
      tags: [Mapas]
      summary: Cerrar sesión de mapas
      description: Expira inmediatamente la cookie `mapa_token` (`Max-Age=0`).
      security: []
      responses:
        '204':
          description: Sesión de mapas revocada

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token emitido por Keycloak (`POST http://localhost:8081/realms/motomensajeria/protocol/openid-connect/token`)
    OAuth2:
      type: oauth2
      description: |
        Login directo con usuario y contraseña de Keycloak (password grant).

        En Swagger UI: **Authorize → OAuth2**, ingresar el usuario y contraseña,
        `client_id` = `motomensajeria-web` y dejar `client_secret` vacío.
        El gateway pide el token a Keycloak y Swagger UI lo usa automáticamente.
      flows:
        password:
          tokenUrl: http://localhost:3000/auth/token
          scopes:
            openid: OpenID Connect
            profile: Perfil del usuario
            email: Correo del usuario

  schemas:
    Envio:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7 generado por la base de datos
          example: 01a1a901-5800-7000-8000-000000000001
        origen:
          type: string
        destino:
          type: string
        estado:
          type: string
          enum: [PENDIENTE, ASIGNADO, EN_CAMINO, ENTREGADO, NO_ENTREGADO, CANCELADO]
        cliente:
          type: string
        mensajero:
          type: string
          nullable: true
        operador_asignador:
          type: string
          nullable: true
        consultas_mapas_realizadas:
          type: integer
          description: Control de cuota NFR-3 (máximo 5 por ciclo de vida)
        fecha_creacion:
          type: string
          format: date-time
        fecha_asignacion:
          type: string
          format: date-time
          nullable: true

    EnvioCadete:
      type: object
      description: Datos básicos de un envío asignado, tal como los ve el cadete
      properties:
        id:
          type: string
          format: uuid
          example: 01a1a901-5800-7000-8000-000000000001
        origen:
          type: string
        destino:
          type: string
        lat_origen:
          type: number
          nullable: true
        lon_origen:
          type: number
          nullable: true
        lat_destino:
          type: number
          nullable: true
        lon_destino:
          type: number
          nullable: true
        estado:
          type: string
          enum: [PENDIENTE, ASIGNADO, EN_CAMINO, ENTREGADO, NO_ENTREGADO, CANCELADO]
        cliente:
          type: string
        mensajero:
          type: string
          nullable: true
        fecha_asignacion:
          type: string
          format: date-time
          nullable: true
        fecha_entrega:
          type: string
          format: date-time
          nullable: true
        actualizado_en:
          type: string
          format: date-time

    EstadoCadeteRequest:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [EN_CAMINO, ENTREGADO, NO_ENTREGADO]
        motivo:
          type: string
          description: Motivo opcional que queda registrado en el historial
          example: Retirado en origen y en tránsito

    HistorialEvento:
      type: object
      properties:
        id:
          type: integer
        estado_anterior:
          type: string
          nullable: true
        estado_nuevo:
          type: string
        cambiado_por:
          type: string
        motivo:
          type: string
          nullable: true
        registrado_en:
          type: string
          format: date-time

    EnvioConHistorial:
      allOf:
        - $ref: '#/components/schemas/Envio'
        - type: object
          properties:
            historial:
              type: array
              items:
                $ref: '#/components/schemas/HistorialEvento'

    ReporteUbicacion:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: -34.6037
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -58.3816
        ts:
          type: integer
          format: int64
          description: Marca de hora del GPS en ms epoch. Si falta, se usa la hora de recepción.
          example: 1760000000000
        rumbo:
          type: number
          minimum: 0
          maximum: 360
          description: Rumbo en grados
          example: 90

    Posicion:
      type: object
      properties:
        cadeteId:
          type: string
          example: C-001
        lat:
          type: number
          format: double
          example: -34.6037
        lng:
          type: number
          format: double
          example: -58.3816
        ts:
          type: integer
          format: int64
          description: Hora del GPS en ms epoch
        recibidoEn:
          type: integer
          format: int64
          description: Hora en que Tracking recibió el reporte en ms epoch
        rumbo:
          type: number
          minimum: 0
          maximum: 360

    Asignacion:
      type: object
      description: Proyección de solo lectura que mantiene Tracking a partir de RabbitMQ
      required: [envioId, cadeteId]
      properties:
        envioId:
          type: string
          format: uuid
          example: 01a1a901-5800-7000-8000-000000000001
        cadeteId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,40}$'
          example: cadete.demo

    AsignacionRequest:
      type: object
      required: [envioId, mensajero]
      properties:
        envioId:
          type: string
          format: uuid
          example: 01a1a901-5800-7000-8000-000000000001
        mensajero:
          type: string
          description: Username de Keycloak del cadete asignado
          pattern: '^[A-Za-z0-9._-]{1,40}$'
          example: cadete.demo

    MetricasTracking:
      type: object
      properties:
        cadetesConPosicion:
          type: integer
          example: 25
        posicionTtlS:
          type: integer
          example: 300
        reportesPorSegundo:
          type: number
          example: 5.0
        reportesTotales:
          type: integer
          example: 1250
        conexionesSse:
          type: integer
          example: 2
        latenciaInternaMs:
          type: object
          properties:
            p50:
              type: number
              nullable: true
            p95:
              type: number
              nullable: true
            p99:
              type: number
              nullable: true
            muestras:
              type: integer

    Notificacion:
      type: object
      properties:
        id:
          type: integer
        envioId:
          type: string
          format: uuid
        cliente:
          type: string
          nullable: true
        mensajero:
          type: string
          nullable: true
        tipo:
          type: string
          example: envio.estado_actualizado
        mensaje:
          type: string
        fecha:
          type: string
          format: date-time

    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

  responses:
    ProblemDetails400:
      description: Solicitud inválida (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails401:
      description: No autenticado o token vencido (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails403:
      description: Rol insuficiente para la operación (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails404:
      description: Recurso no encontrado (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails409:
      description: Conflicto de estado en la máquina de estados (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails502:
      description: Servicio downstream o proveedor de identidad no disponible (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
