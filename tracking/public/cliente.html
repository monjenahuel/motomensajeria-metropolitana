<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguí tu envío</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --ok:#16a34a; --off:#6b7280; --txt:#0f172a; --sub:#64748b; --borde:rgba(15,23,42,.12); }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--txt); }
  #map { position:absolute; inset:0; }
  .card { position:absolute; z-index:1000; left:50%; top:14px; transform:translateX(-50%); width:min(340px, calc(100% - 28px));
          background:rgba(255,255,255,.94); border:1px solid var(--borde); border-radius:16px; padding:14px 16px; box-shadow:0 6px 24px rgba(15,23,42,.18); display:none; }
  .sub { color:var(--sub); font-size:12px; }
  h1 { margin:0; font-size:12px; color:var(--sub); font-weight:600; text-transform:uppercase; letter-spacing:.6px; }
  .envio { font-size:24px; font-weight:700; margin:2px 0 8px; }
  .estado { display:flex; align-items:center; gap:8px; font-weight:600; }
  .punto { width:10px; height:10px; border-radius:50%; background:var(--off); }
  .punto.vivo { background:var(--ok); animation:pulso 1.8s infinite; }
  @keyframes pulso { 0% { box-shadow:0 0 0 0 rgba(22,163,74,.6); } 70% { box-shadow:0 0 0 9px rgba(22,163,74,0); } 100% { box-shadow:0 0 0 0 rgba(22,163,74,0); } }
  .moto-icon { font-size:28px; line-height:32px; text-align:center; filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
  button { font:inherit; padding:9px 11px; border-radius:10px; border:1px solid var(--borde); }
  button { width:100%; background:var(--txt); color:#fff; cursor:pointer; border:0; }
  #recentrar { position:absolute; z-index:1000; right:14px; bottom:96px; width:auto; padding:8px 14px; display:none; box-shadow:0 4px 14px rgba(15,23,42,.25); }
  #msg { color:#b91c1c; margin-top:8px; }
</style>
</head>
<body>
<div id="map"></div>

<div id="card" class="card">
  <h1>Seguimiento de tu envío</h1>
  <div class="envio" id="envioId"></div>
  <div class="estado"><span class="punto" id="punto"></span><span id="estadoTxt">Conectando…</span></div>
  <div class="sub" id="detalle" style="margin-top:4px">Esperando la primera posición…</div>
  <div id="msg"></div>
</div>
<button id="recentrar">Recentrar</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let sinSenalMs = 30000; // tiempo máximo sin reportes antes de indicar "Sin señal"
const envio = (new URLSearchParams(location.search).get('envio') || '').trim();

const AMBA_BOUNDS = L.latLngBounds([-35.10, -59.15], [-34.20, -58.03]);

const map = L.map('map', {
  zoomControl: false, minZoom: 9, maxZoom: 17,
  maxBounds: AMBA_BOUNDS, maxBoundsViscosity: 1.0,
}).setView([-34.66, -58.55], 10);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 17, bounds: AMBA_BOUNDS, attribution: '© OpenStreetMap contributors',
}).addTo(map);

if (/^[0-9a-f-]{36}$/i.test(envio)) seguir(envio);

// ---- Seguimiento: el cliente SOLO abre el canal SSE de SU envío ----
function seguir(envio) {
  $('card').style.display = 'block';
  $('envioId').textContent = envio;
  document.title = `Envío ${envio}`;

  const icono = L.divIcon({ className: 'moto-icon', html: '🛵', iconSize: [32, 32], iconAnchor: [16, 16] });
  const estela = L.polyline([], { color: '#2563eb', weight: 4, opacity: .7 }).addTo(map);
  let marcador = null, from, to, t0 = 0, dur = 1, perf = 0, ultima = 0, centrado = true, cerrado = false;

  const es = new EventSource(`/tracking/envios/${encodeURIComponent(envio)}/stream`);
  es.onmessage = (e) => recibir(JSON.parse(e.data));
  es.addEventListener('error', (e) => {
    if (e.data) {
      const error = JSON.parse(e.data);
      $('msg').textContent = error.mensaje;
      $('estadoTxt').textContent = error.recuperable ? 'Reconectando…' : 'No disponible';
      if (!error.recuperable) { cerrado = true; es.close(); }
    }
    else if (!cerrado) $('estadoTxt').textContent = 'Reconectando…';
  });

  function recibir(p) {
    $('msg').textContent = '';
    const pos = [p.lat, p.lng], ahora = performance.now();
    if (!marcador) {
      marcador = L.marker(pos, { icon: icono, interactive: false }).addTo(map);
      from = to = pos; t0 = ahora; dur = 1;
      map.setView(pos, 16);
    } else {
      const c = marcador.getLatLng();
      from = [c.lat, c.lng]; to = pos; t0 = ahora;
      dur = Math.min(8000, Math.max(800, ahora - perf));   // se desliza durante el intervalo real entre reportes
    }
    perf = ahora; ultima = Number.isFinite(p.recibidoEn) ? p.recibidoEn : Date.now();
    estela.addLatLng(pos);
    if (estela.getLatLngs().length > 60) estela.getLatLngs().shift();
  }

  function frame() {
    if (marcador) {
      const k = Math.min(1, (performance.now() - t0) / dur);
      const ll = [from[0] + (to[0] - from[0]) * k, from[1] + (to[1] - from[1]) * k];
      marcador.setLatLng(ll);
      if (centrado) map.setView(ll, map.getZoom(), { animate: false });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  setInterval(() => {
    if (cerrado || !ultima) return;
    const hace = Math.round((Date.now() - ultima) / 1000), vivo = Date.now() - ultima < sinSenalMs;
    $('punto').className = 'punto' + (vivo ? ' vivo' : '');
    $('estadoTxt').textContent = vivo ? 'En camino' : 'Sin señal reciente';
    $('detalle').textContent = `Última actualización hace ${hace} s`;
  }, 500);

  map.on('dragstart', () => { centrado = false; $('recentrar').style.display = 'block'; });
  $('recentrar').onclick = () => { centrado = true; $('recentrar').style.display = 'none'; };
}
</script>
</body>
</html>
